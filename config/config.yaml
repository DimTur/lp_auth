grpc_server:
  address: ":8081"
  timeout: "2s"
mongo_db:
  url: "mongodb://root:example@localhost:27017/db_sso"
  db_name: db_sso
  username: root
  password: example
rabbit_mq:
  username: guest
  password: guest
  host: localhost
  port: 5672
  otp_exchange:
    name: otp
    kind: fanout
    durable: false
    auto_deleted: false
    internal: false
    no_wait: true
    args:
      alternate_exchange: alternate_exchange_otp
  otp_queue:
    name: otp
    durable: false
    auto_deleted: false
    exclusive: false
    no_wait: true
    args:
      x_message_ttl: 60000
  otp_routing_key: otp
redis:
  host: localhost
  port: 6379
  token_db: 0
  otp_db: 1
  password: ""
jwt:
  issuer: auth-service
  access_expires_in: 10h
  refresh_expires_in: 30h
  public_key: ./public_key.pem   
  private_key: ./private_key.pem